# Project configuration for the idea2prod harness.
# This is the only thing that changes between projects. Fill it in after installing.

project: my-project

github:
  repo: owner/name            # used by gh and by tickets
  board: ""                   # GitHub Project name or number (optional)
  labels:
    - needs grooming
    - needs ui mock
    - security
    - critical

# Commands agents must run as written. Leave empty if they do not apply.
commands:
  setup: ""
  lint: ""
  test: ""
  build: ""
  e2e: ""

paths:
  plans: plans                # private, in .gitignore
  adr: docs/adr
  mocks: mocks
  seeds: seeds

limits:
  review_rounds: 2            # review → fix cycles before escalating to the human
  ci_fix_attempts: 2

review:
  other_family: true          # the reviewer uses a different provider than the builder
  second_reviewer_for: [critical]   # phases that get a second review

# Ephemeral per-ticket database (db-*.sh scripts, pending).
db:
  engine: none                # postgres | sqlite | none
  name_prefix: harness_       # scripts refuse to touch DBs without this prefix
  host_allowlist: [localhost, 127.0.0.1]
  migrate_cmd: ""
  seed_cmd: ""
