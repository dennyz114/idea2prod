# Which model handles each kind of phase. Example values: change them as you like.
# Every phase in the plan carries a label; the agent that runs it uses that row.
# Fixed rule: the `review` row must be from a different family than whoever built.

mechanical:
  provider: claude
  model: sonnet
  effort: high

judgment:
  provider: claude
  model: opus
  effort: high

critical:                 # money, permissions, migrations
  provider: claude
  model: opus
  effort: max

ui:
  provider: claude
  model: opus
  effort: high

review:
  provider: codex
  model: default
  effort: high
